# Exercise library. One entry per exercise; written once, reused for any character.
# Pronouns and the character noun are tokens ({his}, {he}, {him}, {noun}, ...) filled in from characters/*.toml.
# Bootstrapped from the hand-written overnight briefs; this file is now the source of truth.

[[exercise]]
id = "semi-squat-jumps-c4"
job = 1
title = "Chart 4 semi-squat jumps"
chart = 4
view = "side-3q"
tags = ["jump"]
layout_ref = ""
original_previous_sheet = "c4-jump-semi-squat-jumps.png"
schematic_file = "REF-footswitch.png"
schematic_note = '''
a schematic of WHERE the feet are in the four poses (stick figures, side view). Copy the foot positions only; do NOT copy its drawing style or any of its text.
'''
layout = '''
Create a NEW wide 16:9 pose sheet of that same {noun} doing SEMI-SQUAT JUMPS, shown FOUR times left to right, side-on body with the head and shoulders turned about 30 to 45 degrees toward the camera, so most of {his} face (both eyes) and a little of {his} chest show, facing right, with the SAME angle in every pose. Same scale, wide empty gaps so the figures never touch. The two crouching poses rest on the same invisible floor line; the two jumping poses are drawn clearly higher, with both feet well above that line.
'''
keep = '''
the {noun}'s look, line weight and colors, four poses in the same order, the same scale, and the two crouches resting on one floor line with the two jump poses clearly higher.
'''
pitfalls = ['''
The two hop poses look like ballet: toes pointed straight down, the legs stiff, the arms hanging limp and curved. Make it an athletic hop: both knees slightly bent, the feet only about a hand's width off the floor, the shoes mostly level (toes NOT pointed), and the arms swinging forward and a little up for balance with the elbows slightly bent and the fists relaxed.
''', '''
The two crouches do not clearly show the feet swapping. In crouch 1 the NEAR foot ({his} right, the lighter one) is ahead of the FAR foot ({his} left, the darker one) by one FULL shoe length, measured toe to toe. In crouch 3 it is the other way round: the FAR foot is one full shoe length ahead of the near foot. Use the schematic (image 3) for exactly where the feet go.
''', '''
The two hop poses look too similar. They must be different: in pose 2 (the first hop) the feet have ALREADY swapped, so the FAR (left, darker) foot is ahead of the near foot in the air, ready to land that way; in pose 4 (the second hop) the NEAR (right, lighter) foot is ahead of the far foot in the air.
''', '''
The face has a smirk. Use a calm, focused, friendly face: a small closed smile, the eyes looking straight ahead (not up), the eyebrows level.
''', '''
The lower garment looks like tight leggings. Draw it exactly as the BODY AND FACE RULES describe, standing clearly away from the leg where that is specified.
''', '''
In the crouch the back is rounded and the head is pushed forward. The booklet says keep the back as straight as possible: a straight spine leaning forward about 45 degrees, the chest up, the head up and looking ahead, the hands on the knees, the arms straight.
''']

[exercise.qc]
rows = 1
per_row = 4
grounded = [0, 2]
floor_check = true

[exercise.qc.airborne]
"1" = 0.06
"3" = 0.06

[[exercise.poses]]
label = "CROUCH, NEAR FOOT AHEAD"
text = '''
a half crouch with the knees bent about halfway, the back straight and leaning forward about 45 degrees, the chest up, the head up and looking ahead, the hands resting on the knees with the arms straight, the NEAR foot ({his} right foot, lighter) one full shoe length ahead of the FAR foot ({his} left foot, darker), both feet flat on the floor.
'''

[[exercise.poses]]
label = "FIRST HOP"
text = '''
in the air after the jump from crouch 1, the body upright and straight, both knees slightly bent, both feet about a hand's width off the floor with the shoes mostly level (toes NOT pointed), the feet already swapped so the FAR foot ({his} left, darker) is ahead of the near foot, the arms swinging forward and a little up for balance, the elbows slightly bent, the fists relaxed.
'''

[[exercise.poses]]
label = "CROUCH, FAR FOOT AHEAD"
text = '''
landed in the half crouch, the back straight and leaning forward about 45 degrees, the chest up, the head up and looking ahead, the hands resting on the knees with the arms straight, the FAR foot ({his} left, darker) one full shoe length ahead of the NEAR foot ({his} right, lighter), both feet flat on the floor.
'''

[[exercise.poses]]
label = "SECOND HOP"
text = '''
in the air after the jump from crouch 3, the same hop as the first hop but with the feet swapped back, so the NEAR foot ({his} right, lighter) is ahead of the far foot in the air: body upright and straight, knees slightly bent, feet a hand's width off the floor with the shoes mostly level, the arms swinging forward and a little up.
'''

[[exercise]]
id = "toe-touch-circle-c4"
job = 2
title = "Chart 4 toe touch with circle bend"
chart = 4
view = "front"
tags = ["touch", "front"]
layout_ref = "c3-ex1-toe-touching.png"
original_previous_sheet = ""
layout = '''
Create a NEW wide 16:9 pose sheet of that same {noun} doing TOE TOUCHES TO THE LEFT, CENTRE AND RIGHT, THEN A CIRCLE BEND, shown SIX times left to right, strict FRONT view, the {noun} facing the camera (not a side view). Same scale, feet on the same invisible floor line, with wide empty gaps so the figures never touch. The six figures are in the ORDER OF THE MOVEMENT, left to right across the picture, not in the order of where the hands land.
'''

[exercise.qc]
rows = 1
per_row = 6
grounded = [0, 1, 2, 3, 4, 5]
floor_check = true

[[exercise.poses]]
label = "START"
text = '''
standing tall facing the camera, feet wide apart (astride, a little wider than the shoulders), both arms straight up overhead, upper arms beside the ears.
'''

[[exercise.poses]]
label = "TOUCH LEFT"
text = '''
bent forward at the waist, seen from the front, both hands reaching down together with the fingertips touching the floor about six inches OUTSIDE {HIS} LEFT FOOT ({his} left foot is on the RIGHT side of the picture), knees only slightly bent, head hanging down.
'''

[[exercise.poses]]
label = "TOUCH BETWEEN"
text = '''
bent forward in the same way, fingertips of both hands touching the floor BETWEEN {HIS} FEET, pressing down a little, knees only slightly bent, head hanging down.
'''

[[exercise.poses]]
label = "TOUCH RIGHT"
text = '''
bent forward in the same way, fingertips of both hands touching the floor about six inches OUTSIDE {HIS} RIGHT FOOT ({his} right foot is on the LEFT side of the picture), knees only slightly bent, head hanging down.
'''

[[exercise.poses]]
label = "LEAN RIGHT"
text = '''
standing up again out of the right-hand touch, feet still wide apart, both arms held straight up above the head with the upper arms touching the ears, the whole upper body leaning sideways toward {HIS} RIGHT (the left side of the picture) as part of a big circle.
'''

[[exercise.poses]]
label = "BEND BACK"
text = '''
standing, feet wide apart, both arms held straight up above the head with the upper arms touching the ears, bending backward past upright as far as {he} can, hips pushed forward, chest and face lifted toward the sky, knees straight.
'''

[[exercise]]
id = "sit-up-toe-touch-c4"
job = 3
title = "Chart 4 sit-up toe touch"
chart = 4
view = "side-3q"
tags = ["lying"]
layout_ref = ""
original_previous_sheet = "c4-ex2-sit-up-toe-touch.png"
layout = '''
Create a NEW wide 16:9 pose sheet of that same {noun} doing a SIT-UP THAT ENDS BY TOUCHING THE TOES, with the arms kept straight overhead against the ears, shown THREE times left to right, side-on body with the head and shoulders turned about 30 to 45 degrees toward the camera, so most of {his} face (both eyes) and a little of {his} chest show, facing right, with the SAME angle in every pose. In every pose {he} lies on {his} back (or sits) with {his} HEAD ON THE LEFT and {his} FEET ON THE RIGHT, same scale, all on the same invisible floor line, wide empty gaps so the figures never touch. Draw only the {noun}: no chair, no objects.
'''
keep = '''
the {noun}'s look, line weight and colors, three poses in the same order, head on the left and feet on the right, legs straight with the feet together and flat, the same camera angle in every pose, and the START pose with the arms straight along the floor above the head.
'''
pitfalls = ['''
In the last pose the head is upright and sits above the arms, and the arms reach forward below the face. The booklet says the arms stay in contact with the sides of the head THROUGHOUT. In the TOUCH pose {his} head must be tucked down between {his} upper arms, with both upper arms pressed against {his} ears, the whole upper body folded forward over the legs, and the straight arms carrying on forward from the head to the toes.
''', '''
In the middle pose the arms must again be straight and against the sides of {his} head (the head between the arms), not out in front of the face.
''', '''
Leave a wide empty gap between the figures so that no figure is clipped by or touches its neighbour.
''']

[exercise.qc]
rows = 1
per_row = 3
grounded = [0, 1, 2]
floor_check = true

[[exercise.poses]]
label = "START"
text = '''
lying flat on {his} back, legs straight and the feet together, both arms stretched straight out above the head along the floor, the upper arms touching the sides of the head.
'''

[[exercise.poses]]
label = "RISING"
text = '''
halfway up, upper body lifted about 45 degrees off the floor, both arms still straight above the head with the upper arms touching the sides of the head, legs straight, heels on the floor.
'''

[[exercise.poses]]
label = "TOUCH"
text = '''
sitting up and folded forward over the legs, both arms straight and still touching the sides of the head, the fingertips touching the toes, legs straight with the feet flat (knees bent only very slightly), heels on the floor.
'''

[[exercise]]
id = "back-extension-arms-sideways-c4"
job = 4
title = "Chart 4 back extension, arms sideways"
chart = 4
view = "high-3 cameras"
tags = ["lying", "multirow"]
layout_ref = ""
original_previous_sheet = "c4-ex3-back-extension-arms-sideways.png"
schematic_file = "REF-backext-geometry.png"
schematic_note = '''
a schematic of the body angles (side view) and of the T-shaped arms (top-down). Copy the angles and positions only; do NOT copy its drawing style or any of its text.
'''
layout = '''
Create ONE NEW 16:9 image with 3 ROWS. Each row shows the same {noun} doing a BACK EXTENSION WITH THE ARMS STRETCHED SIDEWAYS in the same THREE poses, left to right, in the same order, but from a different camera, so the best camera can be picked:
ROW 1: seen from the FRONT and slightly above, {his} head nearer the camera and {his} feet farther away, so that both arms stick out left and right like a T; raise the camera a little more than before so the legs and shoes can be seen rising behind {him}.
ROW 2: seen from the FOOT END and well above, {his} feet nearer the camera and {his} head farther away, so that both arms stick out left and right like a T and the legs rising toward the camera are clearly visible.
ROW 3: three-quarter view from the SIDE and well above, head on the right and feet on the left, the near arm pointing straight toward the camera at a right angle to {his} body (it will look short because it points at the camera) and the far arm pointing straight away.
'''
key_rule = '''
KEY BODY RULE FOR ALL THREE POSES: {his} arms are stretched straight out SIDEWAYS from the shoulders, like the letter T, one arm out to each side of {his} body, palms down. {His} arms are NOT under {his} thighs and NOT in front of {him}.
'''
extra = ['''
In every figure {he} lies FACE DOWN, flat on {his} belly, with the same orientation within a row. In every row the figures lie on one invisible floor line. Same scale in every figure and every row, a wide empty gap between figures and a wide empty band between rows.
''']
keep = '''
the {noun}'s look, the line weight and colors, three poses in the same order, and in the TOP pose the chest and both thighs clearly lifted with the legs straight.
'''
rows = ['''
ROW 1: seen from the FRONT and slightly above, {his} head nearer the camera and {his} feet farther away, so that both arms stick out left and right like a T; raise the camera a little more than before so the legs and shoes can be seen rising behind {him}.
''', '''
ROW 2: seen from the FOOT END and well above, {his} feet nearer the camera and {his} head farther away, so that both arms stick out left and right like a T and the legs rising toward the camera are clearly visible.
''', '''
ROW 3: three-quarter view from the SIDE and well above, head on the right and feet on the left, the near arm pointing straight toward the camera at a right angle to {his} body (it will look short because it points at the camera) and the far arm pointing straight away.
''']
pitfalls = ['''
In the side-view rows of earlier attempts the start pose did not rest flat. In pose 1 {he} must lie completely flat: belly, chest, thighs and shins resting on the floor line, legs together, chin down near the floor, the arms flat on the floor (see the schematic).
''', '''
In the front view the lift is hard to see. Show how far the chest and the thighs lift in the TOP pose: the chest about 35 degrees up from the floor and the legs about 25 degrees up, with only the lower belly and hips still on the floor (see the schematic), and make the legs, knees and shoes clearly visible rising behind {him}.
''', '''
{He} must have exactly two arms and two legs, and the arms must stretch straight out SIDEWAYS at right angles to {his} body, like the letter T, palms down (see the top-down part of the schematic). An earlier attempt had the near arm trailing back along {his} body, which is wrong.
''', '''
Only the belly and hips may stay on the floor in poses 2 and 3; the legs stay straight and together.
''']

[exercise.qc]
rows = 3
per_row = 3
grounded = []
floor_check = false

[[exercise.poses]]
label = "START"
text = '''
lying completely flat face down, legs straight and together, chin near the floor, both arms stretched straight out sideways on the floor.
'''

[[exercise.poses]]
label = "LIFTING"
text = '''
head, shoulders, arms, chest and both legs just beginning to lift off the floor together, legs straight, arms still stretched out sideways.
'''

[[exercise.poses]]
label = "TOP"
text = '''
head, shoulders, both ARMS, chest AND BOTH THIGHS lifted completely off the floor as high as {he} can, legs straight with the knees LOCKED, back strongly arched, looking forward, arms still stretched straight out sideways and raised; only {his} lower belly and hips stay on the floor.
'''

[[exercise]]
id = "chin-forehead-push-up-c3"
job = 5
title = "Chart 3 chin-forehead push-up"
chart = 3
view = "side + 3q-front"
tags = ["multirow"]
layout_ref = ""
original_previous_sheet = "c3-ex234-sit-back-push.png"
layout = '''
Create ONE NEW 16:9 image with 2 ROWS. Each row shows the same {noun} doing a CHIN-FOREHEAD PUSH-UP (on the palms and toes, knees OFF the floor) in the same THREE poses, left to right, in the same order, but from a different camera, so the best camera can be picked:
ROW 1: plain SIDE view facing right, with both hands visible at the ends of the arms.
ROW 2: three-quarter FRONT view, from the front and a little from one side, so that the head and the hands can be seen clearly.
'''
extra = ['''
Same scale, all on the same invisible floor line, with generous empty space between the figures so they do not touch or overlap. Same scale in every figure and every row, a wide empty gap between figures and a wide empty band between rows.
''']
keep = '''
the {noun}'s look, line weight and colors, three poses in the same order, palms and toes only (knees off the floor), the body one straight line, and the feet on one floor line.
'''
rows = ['''
ROW 1: plain SIDE view facing right, with both hands visible at the ends of the arms.
''', '''
ROW 2: three-quarter FRONT view, from the front and a little from one side, so that the head and the hands can be seen clearly.
''']
pitfalls = ['''
In the FOREHEAD pose the forehead lands IN FRONT of the hands. The booklet says the forehead touches the floor BEHIND the hands: the head tucks back and down so the forehead rests on the floor between the hands, level with them or a little back toward the shoulders, with the hands visibly AHEAD of the forehead.
''', '''
The CHIN pose looks almost the same as the UP pose. The chin pose must be clearly lower: the chin touching the floor in front of the hands, the head pushed forward past the hands, the elbows bent and the chest just above the floor.
''', '''
The three poses must be clearly different from each other: 1 UP with the arms straight; 2 CHIN; 3 FOREHEAD with the chest almost on the floor.
''']

[exercise.qc]
rows = 2
per_row = 3
grounded = [0, 1, 2]
floor_check = true

[[exercise.poses]]
label = "UP"
text = '''
arms fully straightened, palms flat directly under the shoulders, only the palms and toes touching the floor, the body one straight line from the heels to the head (hips NOT piked up, back NOT sagging, knees NOT on the floor).
'''

[[exercise.poses]]
label = "CHIN"
text = '''
lowered until the CHIN touches the floor in front of the hands (the head pushed forward past the hands), elbows bent, palms still flat on the floor under the shoulders, only the palms, toes and chin touching the floor, the body one straight line.
'''

[[exercise.poses]]
label = "FOREHEAD"
text = '''
lowered until the chest is almost on the floor, the head tucked down and back so that the FOREHEAD touches the floor between the hands, level with the line of the hands or slightly behind it (the hands are visibly AHEAD of the forehead, in the direction {he} is facing), the elbows bent and flared out, the palms flat, only the palms, toes and forehead touching the floor, the body one straight line.
'''

