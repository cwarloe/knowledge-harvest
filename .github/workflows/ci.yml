name: CI

on:
  push:
    branches: [main]
  pull_request:

# Job-level `if: hashFiles(...)` is not allowed by GitHub Actions (hashFiles is
# only available in step contexts), which made every run fail before any job
# started. Both apps live at fixed paths, so the jobs just run unconditionally.

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build (CRA; warnings fail the build when CI=true)
        run: npm run build
        env:
          CI: 'true'

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: node --check server.js
      - name: Tests (none yet; passes until some are added)
        run: npm test -- --passWithNoTests
