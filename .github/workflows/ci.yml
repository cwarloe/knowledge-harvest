name: CI

on:
  push:
    branches: [main]
  pull_request:

# Job-level `if: hashFiles(...)` is not allowed by GitHub Actions (hashFiles is
# only available in step contexts), which made every run fail before any job
# started. Both apps live at fixed paths, so the jobs just run unconditionally.

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build (CRA; warnings fail the build when CI=true)
        run: npm run build
        env:
          CI: 'true'
      - name: Frontend recording behavior tests
        run: npm test -- --watch=false --runInBand
        env:
          CI: 'true'

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: node --check server.js
      - name: Tests
        run: npm test

  capability-transfer-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check fictional metrics arithmetic and fail-closed evidence rules
        run: python3 -m unittest discover -s tools/tests -p 'test_capability_transfer_metrics.py' -v
      - name: Validate the checked-in fictional pilot canary
        run: python3 tools/capability_transfer_metrics.py --input docs/capability-transfer/metrics-fixture.json --check
